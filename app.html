<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>キャマイズ　スタジオ</title>
<style>
  body { margin: 0; font: 15px/1.85 -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; color: #1d2330; background: #fff; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
  header a, footer a { color: #2f5bea; }
  header { display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap; border-bottom: 1px solid #e3e6ec; padding-bottom: 12px; margin-bottom: 24px; }
  header b { font-size: 17px; margin-right: auto; }
  h1 { font-size: 22px; } h2 { font-size: 17px; margin-top: 28px; }
  .en { background: #f5f7fb; border-radius: 10px; padding: 4px 18px 10px; margin-top: 32px; }
  .btn { display: inline-block; background: #2f5bea; color: #fff; text-decoration: none; padding: 8px 16px; border-radius: 8px; margin-top: 8px; }
  footer { border-top: 1px solid #e3e6ec; margin-top: 40px; padding-top: 12px; font-size: 13px; color: #687086; display: flex; gap: 16px; flex-wrap: wrap; }
  html, body { height: 100%; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
  input { font: inherit; padding: 8px 10px; border: 1px solid #c9ced8; border-radius: 8px; width: 100%; box-sizing: border-box; }
  button { font: inherit; background: #2f5bea; color: #fff; border: 0; padding: 8px 16px; border-radius: 8px; margin-top: 10px; cursor: pointer; }
</style></head>
<body>
<div class="wrap" id="login" style="display:none">
  <header><b>キャマイズ　スタジオ</b><a href="./">サービス紹介</a><a href="terms.html">利用規約</a><a href="privacy.html">プライバシーポリシー</a></header>
  <h1>ログイン / Sign in</h1>
  <p>担当者から受け取ったアクセスキーを入れてください。<br><span style="color:#687086">Enter the access key you received from Camys.</span></p>
  <input id="key" type="password" autocomplete="off">
  <button id="go">開く / Open</button>
</div>
<script>
  const GAS = "https://script.google.com/macros/s/AKfycbwTdJw0kUTAvf79o9Tm8HqDnaZppEAZ-cjP-eJUlPs-FS1otqr0rmn-6MVy_HLKn_J8/exec";
  const K = 'camysStudioKey';
  function open(key) {
    const f = document.createElement('iframe');
    f.src = GAS + '?k=' + encodeURIComponent(key);
    f.allow = 'clipboard-write';
    document.body.appendChild(f);
  }
  let key = '';
  const m = location.hash.match(/k=([^&]+)/);
  if (m) {
    key = decodeURIComponent(m[1]);
    try { localStorage.setItem(K, key); } catch (e) {}
    history.replaceState(null, '', location.pathname);
  } else {
    try { key = localStorage.getItem(K) || ''; } catch (e) {}
  }
  if (key) open(key);
  else {
    document.getElementById('login').style.display = '';
    document.getElementById('go').onclick = () => {
      const v = document.getElementById('key').value.trim();
      if (!v) return;
      try { localStorage.setItem(K, v); } catch (e) {}
      document.getElementById('login').style.display = 'none';
      open(v);
    };
  }
</script>
</body></html>
